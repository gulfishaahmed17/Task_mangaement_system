<!-- create_task.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Task</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f5f5f5;
    }
    nav {
      background-color: #343a40;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.3rem;
    }
    .container {
      width: 40%;
      margin: 3rem auto;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      padding: 0.7rem;
      margin: 1rem 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #28a745;
      color: white;
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <nav>Welcome, {{ name }} | <a href="/logout" style="color: #ccc;">Logout</a></nav>

  <div class="container">
    <h2>Create New Task</h2>
    <form action="/create-task" method="POST">
      <input type="text" name="task" placeholder="Task Name" required>
      <input type="number" name="urgency" placeholder="Urgency (1-5)" required>
      <input type="number" name="due_in" placeholder="Due in (days)" required>
      <input type="number" name="completion" placeholder="Completion % (0-100)" required>
      <button type="submit">Add Task</button>
    </form>
  </div>
</body>
</html>
