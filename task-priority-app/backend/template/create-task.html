<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Task</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7fa;
    }

    .navbar {
      background-color: #0d47a1;
      padding: 15px 20px;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    .container h2 {
      margin-bottom: 20px;
      color: #0d47a1;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px 20px;
      background-color: #1976d2;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0d47a1;
    }
  </style>
</head>
<body>
  <div class="navbar">🌟 Zephyr Task Manager</div>

  <div class="container">
    <h2>Create New Task</h2>
    <form id="taskForm">
      <label for="task">Task Description</label>
      <input type="text" id="task" required />

      <label for="urgency">Urgency Level (1-10)</label>
      <input type="number" id="urgency" min="1" max="10" required />

      <label for="dueIn">Due in (days)</label>
      <input type="number" id="dueIn" min="0" required />

      <label for="completion">Completion (%)</label>
      <input type="number" id="completion" min="0" max="100" required />

      <button type="submit">Add Task</button>
    </form>
  </div>

  <script>
    document.getElementById("taskForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const task = document.getElementById("task").value;
      const urgency = document.getElementById("urgency").value;
      const dueIn = document.getElementById("dueIn").value;
      const completion = document.getElementById("completion").value;

      const taskData = {
        task,
        urgency,
        due_in: dueIn,
        completion
      };

      let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
      tasks.push(taskData);
      localStorage.setItem("tasks", JSON.stringify(tasks));

      alert("✅ Task added successfully!");
      window.location.href = "dashboard.html"; // Page 4 next
    });
  </script>
</body>
</html>
